name: fletway_mobile
description: >-
  App móvil de Fletway (marketplace two-sided de fletes y mudanzas) con vistas
  diferenciadas Cliente y Transportista. Proyecto final — Ingeniería en Sistemas
  de Información, UTN FRD.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # --- Estado / navegación (D-Flutter: Riverpod + go_router) ---
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # --- Red: API del backend Go (JWT en todos los endpoints) ---
  dio: ^5.5.0

  # --- Supabase directo: Auth (GoTrue) + Realtime (chat RF-10/20, GPS RI-04/RF-15) ---
  supabase_flutter: ^2.5.6

  # --- Geolocalización (RI-04 / RF-15 / RN-06) ---
  geolocator: ^12.0.0

  # --- Modelos / serialización ---
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # --- Infra menor ---
  flutter_dotenv: ^5.1.0
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_lint: ^2.3.13
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - .env
