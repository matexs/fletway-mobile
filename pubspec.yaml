name: fletway_mobile
description: >-
  App móvil de Fletway (marketplace two-sided de fletes y mudanzas) con vistas
  diferenciadas Cliente y Transportista. Proyecto final — Ingeniería en Sistemas
  de Información, UTN FRD.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # es-AR en los componentes de Material (selector de fecha y hora, textos).
  flutter_localizations:
    sdk: flutter

  # --- Estado / navegación (D-Flutter: Riverpod + go_router) ---
  flutter_riverpod: ^3.1.0
  go_router: ^18.0.1

  # --- Red: API del backend Go (JWT en todos los endpoints) ---
  dio: ^5.11.1

  # --- Supabase directo: Auth (GoTrue) + Realtime (chat RF-10/20, GPS RI-04/RF-15) ---
  supabase_flutter: ^2.17.2

  # --- Geolocalización (RI-04 / RF-15 / RN-06) ---
  geolocator: ^14.0.3

  # --- Modelos / serialización ---
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # --- Infra menor ---
  flutter_dotenv: ^6.0.1
  flutter_secure_storage: ^11.0.0
  intl: ^0.20.3
  image_picker: ^1.2.3
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  riverpod_lint: ^3.1.0
  mocktail: ^1.0.5
  custom_lint: ^0.8.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - .env
