include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    invalid_annotation_target: ignore   # freezed + json_serializable
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**
  # Las reglas de riverpod_lint se corren aparte con `dart run custom_lint`
  # (el plugin embebido en el analyzer quedó deprecado). Ver README / pre-commit.

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - unawaited_futures
    - use_key_in_widget_constructors
    - directives_ordering
    # `require_trailing_commas` se omite: el `dart format` de Dart 3.7+ ya
    # gestiona las comas finales y la regla entra en conflicto con el formateo.
